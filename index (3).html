<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maces · Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f6f8;color:#17181b;font:14px Inter,system-ui,sans-serif}.box{width:min(1000px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #e7e8eb;border-radius:18px;padding:22px;margin:14px 0}.login{max-width:420px;margin:15vh auto}.field{margin:14px 0}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}button{padding:11px 16px;border:0;border-radius:10px;background:#151618;color:#fff;font-weight:800;cursor:pointer}.muted{color:#747880}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid #eee;border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="login card"><h1>Portal Maces</h1><p class="muted">Acceso para clientes.</p><form id="loginForm"><div class="field"><input id="email" type="email" placeholder="Correo" required></div><div class="field"><input id="password" type="password" placeholder="Contraseña" required></div><button>Entrar</button><p id="status" class="muted"></p></form></div><main id="app" class="box hidden"><header><h1 id="business">Portal Maces</h1><p id="who" class="muted"></p><button id="logout">Cerrar sesión</button></header><div class="grid"><div class="card"><b>Proyectos</b><div id="projects" class="list">—</div></div><div class="card"><b>Cobros</b><div id="payments" class="list">—</div></div><div class="card"><b>Tickets</b><div id="tickets" class="list">—</div></div></div><div class="card"><h2>Documentos</h2><div id="docs" class="list">—</div></div><div class="card"><h2>Alta Maces</h2><div id="onboarding">—</div></div></main><script>
const db=supabase.createClient('https://sgkowzmfmedldznnnygs.supabase.co','sb_publishable_eAJ0XteDHSj6yLkSfKagQQ_AL_EDSvi');const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('es-VE',{minimumFractionDigits:2});
async function load(user){$('who').textContent=user.email||'';const p=await db.from('profiles').select('role,client_id').eq('id',user.id).single();if(p.error||!p.data||p.data.role!=='cliente'||!p.data.client_id){$('status').textContent='Este acceso aún no está vinculado a un cliente.';await db.auth.signOut();return}const cid=p.data.client_id;const [c,pr,pa,ti,do_,on]=await Promise.all([db.from('clients').select('business_name,email,city,state').eq('id',cid).single(),db.from('projects').select('name,status,progress,estimated_end_date').eq('client_id',cid).order('created_at',{ascending:false}),db.from('payments').select('concept,amount,currency,status,due_date').eq('client_id',cid).order('due_date',{ascending:true}),db.from('tickets').select('title,status,priority,created_at').eq('client_id',cid).order('created_at',{ascending:false}),db.from('documents').select('file_name,document_type,created_at').eq('client_id',cid).order('created_at',{ascending:false}),db.from('onboarding_sessions').select('current_step,total_steps,completed,completed_at').eq('client_id',cid).order('created_at',{ascending:false}).limit(1).maybeSingle()]);$('business').textContent=c.data?.business_name||'Portal Maces';$('projects').innerHTML=pr.data?.length?pr.data.map(x=>`<div class="item"><b>${esc(x.name)}</b><br><span class="muted">${esc(x.status)} · ${esc(x.progress??0)}%${x.estimated_end_date?' · entrega '+esc(x.estimated_end_date):''}</span></div>`).join(''):'<span class="muted">Aún no hay proyectos.</span>';$('payments').innerHTML=pa.data?.length?pa.data.map(x=>`<div class="item"><b>${esc(x.concept)}</b><br>${fmt(x.amount)} ${esc(x.currency||'USD')} · <span class="muted">${esc(x.status)}</span></div>`).join(''):'<span class="muted">Aún no hay cobros.</span>';$('tickets').innerHTML=ti.data?.length?ti.data.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.status)} · ${esc(x.priority)}</span></div>`).join(''):'<span class="muted">No hay tickets.</span>';$('docs').innerHTML=do_.data?.length?do_.data.map(x=>`<div class="item"><b>${esc(x.file_name)}</b><br><span class="muted">${esc(x.document_type)} · ${new Date(x.created_at).toLocaleDateString('es-VE')}</span></div>`).join(''):'<span class="muted">Aún no hay documentos.</span>';$('onboarding').innerHTML=on.data?`<b>${on.completed?'✓ Alta completada':'Alta en progreso'}</b><br><span class="muted">Paso ${on.current_step} de ${on.total_steps}${on.completed_at?' · completada '+new Date(on.completed_at).toLocaleDateString('es-VE'):''}</span>`:'<span class="muted">Alta aún no iniciada.</span>';$('login').classList.add('hidden');$('app').classList.remove('hidden')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('status').textContent='Verificando…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('status').textContent=error.message;return}await load(data.user)};$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.getSession().then(({data})=>data.session&&load(data.session.user));
</script></body></html>
